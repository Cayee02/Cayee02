name: Generar animacion de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generar serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF6A00&color_dots=#EBEDF0,#FFD4B3,#FFAB66,#FF8226,#FF6A00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF6A00&color_dots=#161B22,#5C2A00,#9B4600,#D95F00,#FF8A1F

      - name: Publicar animacion en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
